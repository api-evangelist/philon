aid: philon
name: Philon
description: Philon is a Y Combinator-backed robotics research company building open-source,
  general-purpose humanoid robots capable of performing unsafe, repetitive, or boring
  tasks. Philon develops foundational AI models for embodied agents, including Holo 1.0,
  a generalist vision-language-action model that navigates virtual 3D worlds and completes
  hour-long objectives, alongside research on generative memory, focused attention for
  massive context windows, and latent steering of action experts. The company publishes
  its models and research code openly on GitHub.
